  <script>
  /* Arriving from the home "collaborate" link: paint the incoming blue circle on the
     FIRST frame so the shared circle never blinks out during the page navigation.
     z-index 30 keeps it under the info-row labels (z 40) — the box text stays
     readable the whole time the circle is dissolving. */
  (function(){
    var d; try { d = JSON.parse(sessionStorage.getItem('collabCircle') || 'null'); } catch(e){}
    if (!d || !d.r) return;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    document.body.classList.add('collab-arrive');
    var c = document.createElement('div');
    c.id = 'collabOverlay';
    c.style.cssText = 'position:fixed;left:0;top:0;z-index:30;border-radius:50%;background:#0000FF;'
      + 'width:' + (d.r*2) + 'px;height:' + (d.r*2) + 'px;'
      + 'transform:translate(' + (d.cx-d.r) + 'px,' + (d.cy-d.r) + 'px);'
      + 'pointer-events:none;';
    document.body.appendChild(c);
  })();
  </script>
