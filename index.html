<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
(function(){
  var ua = navigator.userAgent;
  var isMobileUA = /Mobi|Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
  var isTouchMac = navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
  if (isMobileUA || isTouchMac){
    window.location.replace('desktop-only.html');
  }
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vuthy Cheam</title>
<link rel="icon" type="image/png" href="assets/icons/logo.png?v=11" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/png" href="assets/icons/logo-white.png?v=11" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;500&family=Noto+Sans+Thai:wght@400;500&family=Press+Start+2P&family=Silkscreen:wght@400;700&family=Jersey+10&family=VT323&family=Space+Grotesk:wght@400;500;700&family=Boogaloo&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="is-loading">

  <div class="loader" id="loader">
    <div class="loader-panels" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="loader-content">
      <div class="loader-count-wrap">
        <span class="loader-count" id="loaderCount">0</span><span class="loader-pct">%</span>
      </div>
      <div class="loader-line"><span class="loader-line-fill" id="loaderFill"></span></div>
    </div>
  </div>

  <header>
    <div class="home-cluster reveal reveal-1">
      <a href="index.html" aria-label="Home"><img class="header-logo" src="assets/icons/logo.png?v=11" alt="VC"></a>
    </div>
    <a class="home-link reveal reveal-1" href="index.html" id="home-link">[VUTHY CHEAM]</a>
    <span class="time-badge reveal reveal-1">
      <span id="bkk-time">BKK[TH] --:--</span>
      <span class="dot"></span>
    </span>
  </header>


  <section class="hero" id="hero">
    <div class="ticket-stage">
      <!-- 3D printer box (real cuboid) -->
      <div class="printer">
        <div class="pf pf-back"></div>
        <div class="pf pf-left"></div>
        <div class="pf pf-right"></div>
        <div class="pf pf-bottom"></div>
        <div class="pf pf-top"></div>
        <div class="pf pf-front">
          <div class="printer-slot"></div>
        </div>
      </div>

      <!-- feed channel: clips the ticket from the slot down to the hole,
           so it looks like it comes out of the box and later drops into the hole -->
      <div class="ticket-feed" id="ticketFeed">
        <div class="ticket" id="ticket">
          <div class="ticket-perf"></div>
          <div class="ticket-body">
            <span class="ticket-admit">ADMIT ONE</span>
            <span class="ticket-name">VUTHY CHEAM</span>
            <span class="ticket-code">· · — · · — · ·</span>
          </div>
          <div class="ticket-perf ticket-perf-bottom"></div>
        </div>
      </div>

      <!-- the hole/slot the ticket feeds into on scroll -->
      <div class="ticket-hole" id="ticketHole"></div>

      <p class="printer-hint" id="printerHint">Press <kbd>Enter</kbd> to print</p>
    </div>
  </section>

  <!-- Discover More, Projects, About, and Contact sections moved to /sections/ for later reuse. -->

  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
