(function(){
  var ua = navigator.userAgent;
  // never redirect search-engine crawlers / link-preview bots — they must index the real site
  var isBot = /bot|crawl|spider|slurp|bingpreview|google-inspectiontool|lighthouse|headless|facebookexternalhit|embedly|slackbot|twitterbot|whatsapp|telegrambot|discordbot|pinterest/i.test(ua);
  if (isBot) return;
  var isMobileUA = /Mobi|Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
  var isTouchMac = navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
  if (isMobileUA || isTouchMac){
    window.location.replace('desktop-only.html');
  }
})();
</script>

<script>
/* Arrived from another page of the site: mark <html> BEFORE the body renders so
   nothing on the page fades in again on the way back. */
(function(){
  try {
    if (sessionStorage.getItem('pageTransition') !== '1') return;
    sessionStorage.removeItem('pageTransition');
  } catch(e){ return; }
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.documentElement.className += ' pt pt-open';
})();
</script>
<script>
/* Before the first paint: the background starts as the dark its colour bloom
   grows out of (bg-pending), and on a first visit the lockup starts hidden so
   its intro can bring it in (lockup-intro). main.js clears both. */
(function(){
  var html = document.documentElement;
  html.className += ' bg-pending';
  var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!still && html.className.indexOf('pt-open') < 0) html.className += ' lockup-intro';
})();
</script>
