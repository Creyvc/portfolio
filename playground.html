<!DOCTYPE html>

<script>
(function(){
  var ua = navigator.userAgent;
  // never redirect search-engine crawlers / link-preview bots
  var isBot = /bot|crawl|spider|slurp|bingpreview|google-inspectiontool|lighthouse|headless|facebookexternalhit|embedly|slackbot|twitterbot|whatsapp|telegrambot|discordbot|pinterest/i.test(ua);
  if (isBot) return;
  var isMobileUA = /Mobi|Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
  var isTouchMac = navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
  if (isMobileUA || isTouchMac){
    window.location.replace('desktop-only.html');
  }
})();
</script>

<script>
/* Arrived from another page of the site: mark <html> BEFORE the body renders so
   nothing on the page fades in again on the way back. */
(function(){
  try {
    if (sessionStorage.getItem('pageTransition') !== '1') return;
    sessionStorage.removeItem('pageTransition');
  } catch(e){ return; }
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.documentElement.className += ' pt pt-open';
})();
</script>
<script>
/* The tiles rise into place (main.js, "View all"): hold them back before the body renders. */
(function(){
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.documentElement.className += ' view-intro';
})();
</script>
</head>
<body class="loaded playground">

  <header>
    <a class="close-btn reveal reveal-1" href="index.html" aria-label="Back to home">
      <span class="close-bracket" aria-hidden="true">[</span><span class="close-label">CLOSE</span><span class="close-bracket" aria-hidden="true">]</span>
    </a>
  </header>

  <!-- PLAYGROUND's VIEW ALL lands here: each project's screens in a row, after
       gilhuybrecht.com, named over the first and numbered. data-project ties a project's
       tiles together, as hovering one dims every other project's. The videos are started
       by main.js, unless motion is reduced: then they stay on their posters. -->
  <main class="view-grid">
    <figure class="view-tile" data-project="solevault">
      <figcaption><span>Sole Vault</span><span>1</span></figcaption>
      <img src="assets/images/lab/solevault/pics/welcoming.png?v=1" width="658" height="1434" alt="Sole Vault welcome screen">
    </figure>
    <figure class="view-tile" data-project="solevault">
      <figcaption><span></span><span>2</span></figcaption>
      <video muted loop playsinline preload="auto" width="660" height="1434" poster="assets/images/lab/solevault/pics/news-gyakusou.png?v=1" src="assets/images/lab/solevault/video/news.mp4?v=2" aria-label="Sole Vault news screen, scrolling"></video>
    </figure>
    <figure class="view-tile" data-project="solevault">
      <figcaption><span></span><span>3</span></figcaption>
      <video muted loop playsinline preload="auto" width="658" height="1434" poster="assets/images/lab/solevault/pics/collection-top.png?v=1" src="assets/images/lab/solevault/video/collection.mp4?v=2" aria-label="Sole Vault collection screen, scrolling"></video>
    </figure>
    <figure class="view-tile" data-project="solevault">
      <figcaption><span></span><span>4</span></figcaption>
      <img src="assets/images/lab/solevault/pics/ai-chatbot.png?v=1" width="660" height="1434" alt="Sole Vault AI chatbot screen">
    </figure>
  </main>

  <!-- A tile opens its project's page: this text, with the tiles' own pictures and videos
       copied into the column by main.js, flying there from the grid. -->
  <section class="view-detail" data-project="solevault" aria-label="Sole Vault" aria-hidden="true" inert>
    <div class="view-info">
      <h1 class="view-title">Sole Vault</h1>
      <p class="view-about">The only app built for serious collectors. Track, manage, and grow your sneaker collection, all in one place.</p>
      <dl class="view-facts">
        <div><span>1</span><dt>Type</dt><dd>UI/UX</dd></div>
        <div><span>2</span><dt>Platform</dt><dd>Mobile app</dd></div>
        <div><span>3</span><dt>Made in</dt><dd>Figma</dd></div>
      </dl>
    </div>
    <div class="view-column"></div>
  </section>
  <span class="view-back" aria-hidden="true">Back</span>

  <script defer src="src/js/main.js?v=208"></script>
</body>
</html>
