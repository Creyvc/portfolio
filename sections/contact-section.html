<!--
  Contact footer — extracted from index.html so it can be reused later.
  Depends on the site's css/style.css and js/main.js (marquee, contact boxes).
  To restore: paste this <footer> back into index.html where you want it.
-->
<footer class="contact" id="contact">
    <div class="contact-inner">
      <div class="contact-progress" id="contactProgress"></div>
      <div class="contact-boxes">
        <div class="contact-box contact-info">
          <div class="info-circle"></div>
          <div class="info-row"><span class="info-label">Availability</span><span class="info-value">Remote</span></div>
          <div class="info-row"><span class="info-label">Timezone</span><span class="info-value">UTC/GMT +7 hours</span></div>
          <div class="info-row"><span class="info-label">City</span><span class="info-value">Bangkok, Thailand</span></div>
        </div>
        <a class="contact-box" href="#" data-label="Email"><span class="email-clip"><span class="email-glyph">Email</span></span></a>
        <a class="contact-box" href="#" data-label="LinkedIn"><span class="li-clip"><span class="li-letter li-i">i</span><span class="li-letter li-n">n</span></span></a>
        <a class="contact-box" href="#" data-label="GitHub">
          <svg class="github-icon-src" viewBox="0 0 16 16" width="256" height="256" xmlns="http://www.w3.org/2000/svg" style="display:none;">
            <path fill="#000" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
          </svg>
          <img class="github-icon" alt="GitHub">
        </a>
        <a class="contact-box" href="#" data-label="X"><span class="x-glyph">X</span></a>
        <a class="contact-box" href="#" data-label="Threads">
          <img class="threads-icon" src="assets/icons/logo-threads.png" alt="Threads">
        </a>
        <a class="contact-box" href="#" data-label="Instagram"></a>
        <a class="contact-box" href="#" data-label="Resume/CV">
          <span class="resume-line corner-bl">RESUME</span>
          <span class="resume-line corner-tr">RESUME</span>
          <span class="resume-line corner-tl">CV</span>
          <span class="resume-line corner-br">CV</span>
        </a>
      </div>
    </div>

    <h2 class="contact-marquee">
      <span class="contact-marquee-track" id="marqueeTrack">
        <span>Get</span><span>In</span><span>Touch</span>
        <span>Get</span><span>In</span><span>Touch</span>
        <span>Get</span><span>In</span><span>Touch</span>
        <span>Get</span><span>In</span><span>Touch</span>
        <span>Get</span><span>In</span><span>Touch</span>
        <span>Get</span><span>In</span><span>Touch</span>
        <span>Get</span><span>In</span><span>Touch</span>
        <span>Get</span><span>In</span><span>Touch</span>
        <span>Get</span><span>In</span><span>Touch</span>
        <span>Get</span><span>In</span><span>Touch</span>
        <span>Get</span><span>In</span><span>Touch</span>
        <span>Get</span><span>In</span><span>Touch</span>
      </span>
    </h2>

    <button class="top-btn" aria-label="Back to top" onclick="window.scrollTo({top:0, behavior:'smooth'})">
      <span class="top-btn-wrap">
        <span class="top-btn-stack">
          <svg viewBox="0 0 24 24"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
          <svg viewBox="0 0 24 24"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
        </span>
      </span>

  </footer>
