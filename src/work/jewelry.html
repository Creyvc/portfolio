<!DOCTYPE html>
<!-- Both directions run off the page edges rather than the grid: arriving, the
     two lines push past 3% / 97% and off the screen; leaving, they pull back in
     from there. See "ARRIVAL" in style.css. -->
<html lang="en" class="pt-edge-in pt-edge-out">
<head>
<meta charset="UTF-8">
<script>
(function(){
  var ua = navigator.userAgent;
  // never redirect search-engine crawlers / link-preview bots
  var isBot = /bot|crawl|spider|slurp|bingpreview|google-inspectiontool|lighthouse|headless|facebookexternalhit|embedly|slackbot|twitterbot|whatsapp|telegrambot|discordbot|pinterest/i.test(ua);
  if (isBot) return;
  var isMobileUA = /Mobi|Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
  var isTouchMac = navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
  if (isMobileUA || isTouchMac){
    window.location.replace('../../desktop-only.html');
  }
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
/* Arrived through a page transition: mark <html> BEFORE the body renders so the
   cover is already closed on this page's first frame — CSS then pushes the two
   lines back out. Without this you would see the page for a frame first. */
(function(){
  try {
    if (sessionStorage.getItem('pageTransition') !== '1') return;
    sessionStorage.removeItem('pageTransition');
  } catch(e){ return; }
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  /* How far the lines push back out, and what they do when they get there, is
     the arrival option block in style.css — see "ARRIVAL: TWO OPTIONS". */
  document.documentElement.className += ' pt pt-open';
})();
</script>
